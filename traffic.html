const REGIONS = ["台灣","中國","日本","韓國","美國"];
let curDate = DATA.length ? DATA[0].date : null;
let curRegion = "台灣";

const $ = (s)=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function snap(){return DATA.find(d=>d.date===curDate);}

function render(){
  const sel = $("#dateSel");
  sel.innerHTML = DATA.map(d=>`<option value="${esc(d.date)}" ${d.date===curDate?"selected":""}>${esc(d.date)}</option>`).join("");
  const idx = DATA.findIndex(d=>d.date===curDate);
  $("#prevBtn").disabled = idx >= DATA.length-1;
  $("#nextBtn").disabled = idx <= 0;
  const s = snap();
  if(!s){ $("#app").innerHTML = '<div class="empty">尚無資料</div>'; return; }
  let h = "";
  // 全球主線
  h += `<div class="card"><h2>今日全球主線</h2><div class="theme">${esc(s.globalTheme||"")}</div></div>`;
  // 人心觀察（globalSummary）
  if(s.globalSummary){
    h += `<div class="card accent"><h2>人心觀察</h2><div class="summary">${esc(s.globalSummary)}</div></div>`;
  }
  // 故事線
  if(s.storylines && s.storylines.length){
    h += `<div class="card"><h2>故事線</h2>`;
    for(const st of s.storylines){
      const follow = st.kind==="昨日追蹤";
      h += `<div class="story"><span class="kind ${follow?"follow":""}">${esc(st.kind||"")}</span><h3>${esc(st.title||"")}</h3>`;
      if(st.summary) h += `<p>${esc(st.summary)}</p>`;
      if(st.items && st.items.length) h += `<ul>${st.items.map(it=>`<li>${esc(it)}</li>`).join("")}</ul>`;
      h += `</div>`;
    }
    h += `</div>`;
  }
  // 五地分頁
  h += `<div class="tabs">${REGIONS.map(r=>`<button class="tab ${r===curRegion?"on":""}" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>`;
  const evs = (s.events||[]).filter(e=>e.region===curRegion);
  h += `<div class="card">`;
  for(const cat of ["綜合","生活"]){
    const list = evs.filter(e=>e.category===cat).sort((a,b)=>(a.rank||0)-(b.rank||0));
    if(!list.length) continue;
    h += `<div class="cat">${cat}類</div>`;
    for(const e of list){
      const dia = e.brandRelevant ? ' <span class="diamond" title="與大道至簡品牌相關">◇</span>' : "";
      const title = e.sourceUrl
        ? `<a href="${esc(e.sourceUrl)}" target="_blank" rel="noopener">${esc(e.title)}</a>`
        : esc(e.title);
      h += `<div class="ev"><div class="rank">${esc(e.rank||"")}</div><div class="ev-main">`
         + `<div class="ev-title">${title}${dia}</div>`
         + (e.summary?`<div class="ev-sum">${esc(e.summary)}</div>`:"")
         + `</div></div>`;
    }
  }
  if(!evs.length) h += `<div class="empty">本日此地無資料</div>`;
  h += `</div>`;
  // 選題建議
  if(s.suggestions && s.suggestions.length){
    h += `<div class="card"><h2>選題建議</h2>`;
    for(const g of s.suggestions){
      const dia = g.brandRelevant ? ' <span class="diamond">◇</span>' : "";
      h += `<div class="sug"><span class="pillar">${esc(g.pillar||"")}</span><span class="sug-title">${esc(g.title||"")}</span>${dia}`
         + (g.direction?`<div class="sug-dir">${esc(g.direction)}</div>`:"") + `</div>`;
    }
    h += `</div>`;
  }
  $("#app").innerHTML = h;
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{curRegion=b.dataset.r;render();}));
}

$("#dateSel").addEventListener("change",e=>{curDate=e.target.value;render();});
$("#prevBtn").addEventListener("click",()=>{const i=DATA.findIndex(d=>d.date===curDate); if(i<DATA.length-1){curDate=DATA[i+1].date;render();}});
$("#nextBtn").addEventListener("click",()=>{const i=DATA.findIndex(d=>d.date===curDate); if(i>0){curDate=DATA[i-1].date;render();}});
render();
</script>
</body>
