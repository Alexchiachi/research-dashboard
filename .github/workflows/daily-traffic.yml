name: 每日社群流量 Top10 全球情報雲端自動巡檢與發布

on:
  schedule:
    # 每天 UTC 23:00 觸發（對應台灣時間 UTC+8 早上 07:00）
    - cron: '0 23 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊執行

permissions:
  contents: write

jobs:
  daily-traffic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出最新程式碼 (Checkout repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝建置依賴 (Install build dependencies)
        run: |
          pip install --no-cache-dir markdown opencc-python-reimplemented

      - name: AI 智能採集七地社群流量 (Collect Traffic via Gemini AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/collect_traffic_ai.py

      - name: 同步備份至 Google 雲端硬碟 (Sync to Google Drive)
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: |
          TODAY=$(date -u -d '+8 hours' +%Y-%m-%d)
          python3 sync_traffic_to_gdrive.py "$TODAY" || echo "Google Drive 同步略過或完成"

      - name: 編譯流量模組與全站靜態頁面 (Build traffic & static site)
        run: |
          python3 build_traffic.py
          python3 build.py

      - name: 提交更新並發布至 GitHub Pages (Commit & Push to main)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add reports/02_traffic/ traffic.html index.html zh-cn/index.html sitemap.xml robots.txt
          
          TODAY=$(date -u -d '+8 hours' +%Y-%m-%d)
          if git diff --staged --quiet; then
            echo "今日資料無變更，無需 Commit。"
          else
            git commit -m "feat(traffic): 自動更新每日七地流量情報 ($TODAY) [skip ci]"
            git push origin main
          fi
