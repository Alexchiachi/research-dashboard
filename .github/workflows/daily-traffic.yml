name: 每日社群流量 Top10 全球情報雲端自動巡檢與發布

on:
  schedule:
    # 每天 UTC 18:00 觸發（台灣時間 02:00）。GitHub 排程常延遲 1~3 小時，提早觸發確保 07:00 前發布
    - cron: '0 18 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊執行
    inputs:
      simulate_failure:
        description: '測試用：故意讓流程失敗，以驗證失敗通知'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  daily-traffic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出最新程式碼 (Checkout repository)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝建置依賴 (Install build dependencies)
        run: |
          pip install --no-cache-dir markdown opencc-python-reimplemented

      - name: 測試失敗通知 (Simulate failure)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "依手動輸入 simulate_failure=true 故意失敗，用來驗證失敗通知"
          exit 1

      - name: AI 智能採集七地社群流量 (Collect Traffic via Gemini AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"   # log 即時輸出，方便看每一步花多久
        run: |
          python3 scripts/collect_traffic_ai.py

      - name: 嚴格驗證新聞連結真實性 (Validate Traffic URLs)
        # 每天一定有發佈：採集步驟已擋下致命錯誤，此處只做複查並以警告呈現，不阻斷發佈
        continue-on-error: true
        run: |
          TODAY=$(date -u -d '+8 hours' +%Y-%m-%d)
          python3 scripts/validate_traffic_urls.py reports/02_traffic/daily/${TODAY}.json

      - name: 同步備份至 Google 雲端硬碟 (Sync to Google Drive)
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: |
          TODAY=$(date -u -d '+8 hours' +%Y-%m-%d)
          python3 sync_traffic_to_gdrive.py "$TODAY" || echo "Google Drive 同步略過或完成"

      - name: 編譯流量模組與全站靜態頁面 (Build traffic & static site)
        run: |
          python3 build_traffic.py
          python3 build.py

      - name: 提交更新並發布至 GitHub Pages (Commit & Push to main)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add reports/02_traffic/ traffic.html index.html zh-cn/index.html sitemap.xml robots.txt
          
          TODAY=$(date -u -d '+8 hours' +%Y-%m-%d)
          if git diff --staged --quiet; then
            echo "今日資料無變更，無需 Commit。"
          else
            git commit -m "feat(traffic): 自動更新每日七地流量情報 ($TODAY) [skip ci]"
            # 執行期間若有人推了新 commit，先同步再推送，避免 non-fast-forward 失敗
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD
          fi

      - name: 失敗時開 Issue 通知 (Notify on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u -d '+8 hours' +%Y-%m-%d)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="🚨 每日流量情報自動發佈失敗"
          BODY=$(printf '%s\n\n- 日期：%s\n- 觸發方式：%s\n- 分支：%s\n- 執行紀錄：%s\n\n請點執行紀錄查看失敗步驟的 log。修好並成功發佈後即可關閉此 issue。' \
            "今天的每日社群流量情報沒有發佈成功。" "$TODAY" "${{ github.event_name }}" "${{ github.ref_name }}" "$RUN_URL")
          # 已有未關閉的失敗通知就留言，避免連續失敗時開一堆 issue
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
            echo "已在 issue #$EXISTING 留言通知"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
